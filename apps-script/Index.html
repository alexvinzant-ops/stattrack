async function loadHome() {
  if (hasDashboard()) {
    S.data = await call('all');
    S.me = S.data.me;
    S.teamName = S.data.settings.teamName;
    if (!coachTabList().some(t => t[0] === S.tab)) S.tab = coachTabList()[0][0];
  } else {
    S.data = await call('scorerHome');
    S.teamName = S.data.me.teamName;
  }
  store.set('gcs_team', S.teamName);
}

async function boot() {
  if (!S.pin) { S.view = 'login'; render(); return; }
  try {
    S.me = await call('me');
    await loadHome();
    S.view = hasDashboard() ? 'coach' : 'scorer';
    render();
    Queue.flush();
  } catch (err) {
    if (err.auth) return logout(err.message);
    S.view = 'login'; S.loginErr = err.network ? 'No connection. Check your signal and try again.' : err.message; render();
  }
}

async function login() {
  if (S.busy || S.pinEntry.length < 4) return;
  S.busy = true; S.loginErr = ''; render();
  S.pin = S.pinEntry;
  try {
    S.me = await call('me');
    store.set('gcs_pin', S.pin);
    S.pinEntry = '';
    await loadHome();
    S.view = hasDashboard() ? 'coach' : 'scorer';
    Queue.flush();
  } catch (err) {
    S.pin = '';
    S.loginErr = err.message;
    S.pinEntry = '';
  }
  S.busy = false;
  render();
}

function logout(msg) {
  S.pin = ''; S.me = null; S.data = null; S.t = null; S.pinEntry = ''; S.loginErr = msg || '';
  store.del('gcs_pin');
  closeModal();
  S.view = 'login'; render();
}

async function coachSave(action, data) {
  try {
    S.data = await call(action, data);
    S.me = S.data.me;
    S.teamName = S.data.settings.teamName;
    store.set('gcs_team', S.teamName);
    closeModal();
    render();
    return true;
  } catch (err) {
    if (err.auth) { logout(err.message); return false; }
    if (modalState) modalErr(err.message); else toast(err.message);
    return false;
  }
}

function buildReport() {
  const d = S.data;
  const rows = seasonTable().filter(r => r.gp).sort((a, b) => byNumber(a.p, b.p));
  const season = [['#', 'Player', 'GP', 'PTS', 'PPG', 'REB', 'RPG', 'OREB', 'DREB', 'AST', 'APG', 'STL', 'SPG', 'BLK', 'BPG', 'TO', 'TOPG', 'FGM', 'FGA', 'FG%', '3PM', '3PA', '3P%', 'FTM', 'FTA', 'FT%', 'PF']];
  rows.forEach(r => {
    const l = r.l, g = r.gp, a = v => Math.round(10 * v / g) / 10;
    season.push([r.p.number, r.p.name, g, l.pts, a(l.pts), l.REB, a(l.REB), l.OREB, l.DREB, l.AST, a(l.AST), l.STL, a(l.STL), l.BLK, a(l.BLK), l.TO, a(l.TO),
      l.fgm, l.fga, pctNum(l.fgm, l.fga), l.FG3M, l.FG3A, pctNum(l.FG3M, l.FG3A), l.FTM, l.FTA, pctNum(l.FTM, l.FTA), l.PF]);
  });
  const log = [['Date', 'Opponent', 'Location', 'Status', 'Team', 'Opp', 'Side', '#', 'Player', 'PTS', 'FGM', 'FGA', '3PM', '3PA', 'FTM', 'FTA', 'REB', 'OREB', 'DREB', 'AST', 'STL', 'BLK', 'TO', 'PF']];
  gamesWithStats().forEach(g => {
    const box = d.boxes[g.id];
    d.players.slice().sort(byNumber).forEach(p => {
      if (!played(box[p.id])) return;
      const l = line(box[p.id]);
      log.push([g.date, g.opponent, g.location, g.status, teamPts(box), oppPts(box), d.settings.teamName, p.number, p.name, l.pts, l.fgm, l.fga, l.FG3M, l.FG3A, l.FTM, l.FTA, l.REB, l.OREB, l.DREB, l.AST, l.STL, l.BLK, l.TO, l.PF]);
    });
    oppPlayerList(g.oppRoster, box).forEach(p => {
      if (!hasAny(box[p.id])) return;
      const l = line(box[p.id]);
      log.push([g.date, g.opponent, g.location, g.status, teamPts(box), oppPts(box), 'Opponent', p.number, p.name || (p.id === 'opp:team' ? 'Team' : ''), l.pts, l.fgm, l.fga, l.FG3M, l.FG3A, l.FTM, l.FTA, l.REB, l.OREB, l.DREB, l.AST, l.STL, l.BLK, l.TO, l.PF]);
    });
  });
  return { 'Season Stats': season, 'Game Log': log };
}

    }

  async emailAll(el) {
    const list = S.data.parents.filter(p => p.active && p.email && !p.invited);
    if (!list.length) return;
    if (!confirm('Email invites to ' + list.length + ' ' + (list.length === 1 ? 'person' : 'people') + ' from your Gmail?\n\n' + list.map(p => p.name + ' (' + p.email + ')').join('\n'))) return;
    el.disabled = true;
    let sent = 0;
    const failed = [];
    for (const p of list) {
      el.textContent = 'Sending ' + (sent + failed.length + 1) + ' of ' + list.length + '…';
      try { S.data = await call('emailInvite', { id: p.id, subject: inviteSubject(), body: inviteText(p) }); sent++; }
      catch (err) { if (err.auth) return logout(err.message); failed.push(p.name + ': ' + err.message); }
    }
    render();
    if (failed.length) alert('Sent ' + sent + '. Not sent:\n' + failed.join('\n'));
    else toast('Sent ' + sent + ' invite' + (sent === 1 ? '' : 's'));
  },
  copyInvite() {

  },
  pickPlayer(el) {
    const id = el.dataset.id, t = S.t;
    if (t.armed) return recordTap(t.armed, id);
    t.sel = t.sel === id ? null : id;
    render();
  },
  stat(el) {
    const code = el.dataset.code, t = S.t;
    if (t.sel) return recordTap(code, t.sel);
    t.armed = t.armed === code ? null : code;
    render();
  },
  clearSel() { S.t.sel = null; S.t.armed = null; render(); },
  opp(el) {
    const d = Number(el.dataset.d);
    if (d < 0 && oppPts(S.t.box) <= 0) return;
    commit('', [mkEv('', 'OPP', d)], (d > 0 ? '+' : '−') + Math.abs(d) + ' opponent point' + (Math.abs(d) === 1 ? '' : 's'));
    render();
  },
  undo(el) {
    const t = S.t;
    if (!t) return;
    const p = t.plays.find(x => x.id === el.dataset.id);
    if (!p || p.undone) return;
    // Undo lands in the quarter the play happened in, even if the quarter has changed since.
    const rev = p.events.map(e => mkEv(e.playerId, e.stat, -e.delta, e.period || null));
    rev.forEach(e => applyAll(t, e));
    Queue.push(rev);
    p.undone = true;
    saveGameLocal();
    $('#toast-root').innerHTML = '';
    toast('Undone: ' + p.label);
    render();
    if (modalState && modalState.plays) playsModal();

    const t = S.t, id = el.dataset.id, k = el.dataset.k, d = Number(el.dataset.d);
    const scope = k === 'GP' ? 0 : ((modalState && modalState.scope) || 0);
    const src = scope ? line(((t.periodBoxes || {})[scope] || {})[id]) : line(t.box[id]);
    const cur = k === 'REB' ? src.rebRaw : src[k];
    if (cur + d < 0 || (k === 'GP' && cur + d > 1)) return;
    const e = mkEv(id, k, d, scope || null); e.fix = true;
    commit(id, [e], 'Fix: ' + (d > 0 ? '+1 ' : '−1 ') + BASE_LABELS[k].toLowerCase(), true);
    lineEditor(id);
    render();

  async setStatus(el) {

    try {
      await Queue.drain(t.game.id);
      await call('setStatus', { gameId: t.game.id, status: status });
      t.game.status = status;
      render();
      toast('Game marked ' + (status === 'scheduled' ? 'upcoming' : status));
    } catch (err) { err.auth ? logout(err.message) : toast(err.message); }
  },
  async endGame(el) {
    const t = S.t, manager = can('manage');
    const label = el.textContent;
    const score = shortTeam() + ' ' + teamPts(t.box) + ', ' + t.game.opponent + ' ' + oppPts(t.box);
    if (!confirm(manager
      ? 'End the game and mark it final?\n\nFinal score: ' + score + '\n\nYou can still fix numbers afterwards.'
      : 'Submit final stats for ' + gameTitle(t.game) + '?\n\nFinal score: ' + score + '\n\nYou won\'t be able to change them after this.')) return;
    el.disabled = true; el.textContent = 'Saving all plays…';
    const ok = await Queue.drain(t.game.id, 20000);
    if (!ok) {
      el.disabled = false; el.textContent = label;
      return alert('Some plays are still waiting to save. Check your connection and try again. Nothing is lost; they are stored on this phone.');
    }
    try {
      await call('setStatus', { gameId: t.game.id, status: 'final' });
      if (manager) {
        t.game.status = 'final';
        t.tab = 'box';
        render();
        window.scrollTo(0, 0);
        toast('Game over. Final: ' + score);
        return;
      }
      store.del('gcs_box_' + localKey(t.game.id)); store.del('gcs_plays_' + localKey(t.game.id)); store.del('gcs_period_' + localKey(t.game.id));
      toast('Thanks! Stats sent to the coach.');
      await ACTS.leaveGame();

const FORMS = {
  player(f) {
    return coachSave('savePlayer', { id: f.elements.id.value, number: f.elements.number.value, name: f.elements.name.value, active: f.elements.active ? f.elements.active.checked : true });
  },
  bulkGames(f) {
    const lines = f.elements.list.value.split('\n').map(x => x.trim()).filter(Boolean);
    if (!lines.length) return modalErr('Type at least one game.');
    const list = [];
    for (const l of lines) {
      const g = parseGameLine(l);
      if (!g) return modalErr('Couldn\'t read: “' + l + '”. Start with a date like 11/10.');
      list.push(g);
    }
    return coachSave('addGames', { list: list });
  },
  bulk(f) {
    const list = f.elements.list.value.split('\n').map(s => s.trim()).filter(Boolean).map(s => {
      const m = /^#?(\d{1,3})[\s,.\-:]+(.+)$/.exec(s);
      return m ? { number: m[1], name: m[2].trim() } : { number: '', name: s };
    });
    if (!list.length) return modalErr('Type at least one player.');
    return coachSave('addPlayers', { list: list });
  },
  game(f) {
    return coachSave('saveGame', { id: f.elements.id.value, date: f.elements.date.value, opponent: f.elements.opponent.value, location: f.elements.location.value, scorerIds: Array.from(f.querySelectorAll('input[name=sc]:checked')).map(i => i.value), status: f.elements.status.value, notes: f.elements.notes.value, oppRoster: f.elements.oppRoster.value });
  },
  parent(f) {
    const checked = name => Array.from(f.querySelectorAll('input[name=' + name + ']:checked')).map(i => i.value);
    const see = (f.querySelector('input[name=see]:checked') || {}).value || 'none';
    const players = checked('pl');
    if (see === 'own' && !players.length) return modalErr('To let them see their own player, check that player under "Their own player(s)".');
    const perms = {
      trackAny: (f.querySelector('input[name=games]:checked') || {}).value === 'any',
      fixStats: f.elements.fixStats.checked,
      viewStats: see === 'team',
      viewOwn: see === 'own',
      manage: f.elements.manage.checked,
    };
    const isNew = !f.elements.id.value;
    const before = new Set(S.data.parents.map(p => p.id));
    return coachSave('saveParent', { players: players, id: f.elements.id.value, name: f.elements.name.value, email: f.elements.email.value, phone: f.elements.phone.value, active: f.elements.active ? f.elements.active.checked : true, newPin: !!(f.elements.newPin && f.elements.newPin.checked), perms: perms, trackGroups: checked('tg'), viewGroups: checked('vg') })
      .then(ok => {
        // New person with contact info: go straight to sending their invite.
        const added = ok && isNew && S.data.parents.find(p => !before.has(p.id));
        if (added && (added.email || added.phone)) inviteModal(added);
        return ok;
      });
  },
  settings(f) {
    return coachSave('saveSettings', { teamName: f.elements.teamName.value, season: f.elements.season.value }).then(ok => ok && toast('Saved'));
  },
  async oppRoster(f) {
    const t = S.t;
    try {
      const r = await call('setOppRoster', { gameId: t.game.id, roster: f.elements.roster.value });
      t.game.oppRoster = r.oppRoster;
      saveGameLocal();
      closeModal();
      render();
    } catch (err) { modalErr(err.network ? 'No connection. Try again in a moment, or use TEAM for now.' : err.message); }
  },
  whosHere(f) {
    const t = S.t;
    const checked = new Set(Array.from(f.querySelectorAll('input[name=p]:checked')).map(i => i.value));
    const evs = [];
    gamePlayers().forEach(p => {
      const gp = n0((t.box[p.id] || {}).GP);
      if (checked.has(p.id) && gp < 1) evs.push(mkEv(p.id, 'GP', 1 - gp));
      if (!checked.has(p.id) && gp > 0) evs.push(mkEv(p.id, 'GP', -gp));
    });
    if (evs.length) commit('', evs, 'Set who\'s playing', true);
    closeModal();
    render();
  },
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') return;
  if (el.dataset.act === 'overlay' && ev.target !== el) return; // click inside the dialog
  ev.preventDefault();
  fn(el, ev);
});
document.addEventListener('submit', async ev => {
  const f = ev.target.closest('form[data-form]');
  if (!f) return;
  ev.preventDefault();
  const btn = f.querySelector('button[type=submit]');
  if (btn) { if (btn.disabled) return; btn.disabled = true; }
  try { await FORMS[f.dataset.form](f); } finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
});
document.addEventListener('keydown', ev => {
  if (S.view !== 'login') return;
  if (/^\d$/.test(ev.key)) ACTS.key({ dataset: { k: ev.key } });
  else if (ev.key === 'Backspace') ACTS.key({ dataset: { k: 'back' } });
  else if (ev.key === 'Enter') login();
});
window.addEventListener('beforeunload', ev => { if (Queue.count()) { ev.preventDefault(); ev.returnValue = ''; } });

boot();
</script>
</body>
</html>
