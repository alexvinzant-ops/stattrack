<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Stats</title>
<style>
:root {
  --accent: #1c3d8c;
  --accent-2: #2f5bd0;
  --accent-ink: #ffffff;
  --gold: #f2b705;
  --bg: #eef1f6;
  --card: #ffffff;
  --ink: #141821;
  --muted: #5f6b7d;
  --line: #dde2ea;
  --good: #0f7a55;
  --good-bg: #e3f5ec;
  --bad: #b8322a;
  --bad-bg: #fbe9e7;
  --warn: #b26a00;
  --warn-bg: #fff3dc;
  --sel: #ffd84d;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:disabled { opacity: .45; cursor: default; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 96px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap-row { flex-wrap: wrap; }
.spacer { flex: 1; }
.hidden { display: none !important; }

/* Top bar */
.top { background: var(--accent); color: var(--accent-ink); position: sticky; top: 0; z-index: 20; }
.top .bar { max-width: 920px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; min-height: 52px; }
.top h1 { font-size: 18px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .link { color: var(--accent-ink); opacity: .9; font-size: 14px; padding: 6px 8px; border-radius: 8px; }
.top .link:active { background: rgba(255,255,255,.15); }
.tabs { max-width: 920px; margin: 0 auto; display: flex; padding: 0 8px; overflow-x: auto; }
.tabs button { color: var(--accent-ink); opacity: .75; padding: 10px 12px 12px; font-weight: 600; font-size: 15px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button.on { opacity: 1; border-color: var(--gold); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border-radius: 10px; font-weight: 600; background: var(--card); border: 1px solid var(--line); min-height: 42px; }
a.btn { text-decoration: none; color: inherit; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.big { width: 100%; min-height: 52px; font-size: 17px; }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 14px; }
.btn:active:not(:disabled) { transform: translateY(1px); }

/* Cards & lists */
.card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); padding: 14px; margin-top: 12px; }
.card h2 { font-size: 17px; margin-bottom: 8px; }
.section-title { margin: 20px 2px 0; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.list-item:first-child { border-top: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.jersey { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; flex: none; }
.jersey.off { background: #a7b0bf; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; background: #e6eaf1; color: var(--muted); }
.chip.live { background: var(--bad-bg); color: var(--bad); }
.chip.final { background: #e4e8ef; color: #334; }
.chip.win { background: var(--good-bg); color: var(--good); }
.chip.loss { background: var(--bad-bg); color: var(--bad); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }

/* Stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile .label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
.tile .value { font-size: 26px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Tables */
.table-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { padding: 9px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; position: sticky; top: 0; background: var(--card); }
th.sortable { cursor: pointer; user-select: none; }
th.sorted { color: var(--accent); }
td:first-child, th:first-child { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; }
tr.total td { font-weight: 800; border-top: 2px solid var(--ink); }
tr.click { cursor: pointer; }
tr.click:active td { background: #f3f6fb; }
.pname { font-weight: 600; }
.pnum { color: var(--muted); font-weight: 600; margin-right: 4px; }

/* Segmented control */
.seg { display: inline-flex; background: #e3e8f0; border-radius: 10px; padding: 3px; }
.seg button { padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Forms */
label.field { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
label.field input, label.field select, label.field textarea { display: block; width: 100%; margin-top: 4px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-weight: 400; font-size: 16px; }
label.check { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-weight: 600; }
label.check input { width: 22px; height: 22px; flex: none; }
.form-actions { display: flex; gap: 8px; margin-top: 18px; }
.form-actions .btn { flex: 1; }
.err { color: var(--bad); font-weight: 600; min-height: 1.4em; margin-top: 8px; }
.note { background: var(--warn-bg); color: #6b4300; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(10,16,30,.5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--card); width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
@media (min-width: 600px) { .overlay { align-items: center; } .modal { border-radius: 18px; } }
.modal h2 { font-size: 19px; }

/* Login */
.login { max-width: 360px; margin: 0 auto; padding: 32px 16px; text-align: center; }
.login .logo { width: 72px; height: 72px; border-radius: 20px; background: var(--accent); margin: 0 auto 12px; display: grid; place-items: center; font-size: 40px; }
.login h1 { font-size: 22px; }
.dots { display: flex; justify-content: center; gap: 12px; margin: 24px 0 4px; min-height: 18px; }
.dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); }
.dots span.on { background: var(--accent); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 16px; }
.keypad button { height: 62px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 24px; font-weight: 600; }
.keypad button:active { background: #e6ebf3; }

/* Tracker */
.score { background: var(--accent); color: var(--accent-ink); }
.score .inner { max-width: 920px; margin: 0 auto; padding: 4px 16px 12px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.score .team { text-align: center; min-width: 0; }
.score .team .nm { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score .team .pts { font-size: 38px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.score .dash { font-size: 22px; opacity: .6; }
.opp-pad { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
.opp-pad button { background: rgba(255,255,255,.16); color: var(--accent-ink); border-radius: 8px; padding: 4px 9px; font-weight: 700; font-size: 14px; min-width: 38px; }
.opp-pad button:active { background: rgba(255,255,255,.3); }
.sync { font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #39d98a; }
.sync.pending::before { background: var(--gold); }
.sync.offline::before, .sync.error::before { background: #ff6b5e; }

.hint { text-align: center; font-weight: 600; color: var(--muted); padding: 10px 0 4px; min-height: 36px; }
.hint b { color: var(--ink); }
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.pbtn { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; min-height: 72px; }
.pbtn .n { font-size: 22px; font-weight: 800; line-height: 1.1; }
.pbtn .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbtn .ln { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pbtn .ln .foul4 { color: var(--warn); font-weight: 800; }
.pbtn .ln .foul5 { color: var(--bad); font-weight: 800; }
.pbtn.sel { border-color: var(--accent); background: var(--sel); }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.sbtn { border-radius: 12px; min-height: 58px; font-weight: 800; font-size: 16px; background: var(--card); border: 2px solid var(--line); line-height: 1.1; }
.sbtn small { display: block; font-size: 11px; font-weight: 700; opacity: .8; letter-spacing: .04em; }
.pad .sbtn:last-child:nth-child(4n+1) { grid-column: span 4; }
.sbtn.make { background: var(--good-bg); border-color: #9fd8bd; color: var(--good); }
.sbtn.miss { background: var(--bad-bg); border-color: #efb4ad; color: var(--bad); }
.sbtn.armed { outline: 3px solid var(--accent); outline-offset: 1px; background: var(--sel); color: var(--ink); }
.sbtn:active { filter: brightness(.94); }
.plays .list-item { padding: 9px 0; }
.side-seg { width: 100%; display: flex; }
.personal-bar { grid-template-columns: 1fr auto !important; text-align: left; }
.personal-bar .nm { font-size: 15px !important; text-transform: none !important; letter-spacing: 0 !important; font-weight: 700; opacity: 1 !important; }
table.compare td.diff { background: var(--warn-bg); color: #6b4300; font-weight: 800; }
table.compare tr.book-row td { border-bottom-width: 2px; }
.help-steps { padding-left: 22px; margin: 12px 0 0; }
.help-steps li { margin-bottom: 12px; }
.help-steps li span { display: block; color: var(--muted); font-size: 14px; }
.period-bar { background: var(--accent); color: var(--accent-ink); position: relative; }
.period-bar .inner { max-width: 920px; margin: 0 auto; padding: 0 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.period-seg { background: rgba(255,255,255,.16); }
.period-seg button { color: var(--accent-ink); min-width: 46px; padding: 7px 10px; font-size: 15px; }
.period-seg button.on { background: var(--gold); color: #1d2433; }
.box-filter { margin: 4px 0 10px; display: flex; flex-wrap: wrap; }
.box-filter button { flex: 1; min-width: 44px; padding: 6px 8px; }
.trend-wrap { overflow-x: auto; }
svg.trend { width: 100%; min-width: 320px; height: auto; display: block; }
svg.trend .bar { fill: var(--accent); }
svg.trend .axis { stroke: var(--line); stroke-width: 1.5; }
svg.trend .avg { stroke: var(--gold); stroke-width: 2; stroke-dasharray: 6 4; }
svg.trend text { font: 600 17px -apple-system, Segoe UI, Roboto, sans-serif; text-anchor: middle; fill: var(--ink); }
svg.trend .tl { fill: var(--muted); font-weight: 500; }
svg.trend .tl.op { font-size: 14px; }
svg.trend .tv { font-size: 20px; font-weight: 800; }
.trend-seg { display: flex; flex-wrap: wrap; gap: 2px; margin: 4px 0 10px; }
.trend-seg button { flex: 0 0 auto; padding: 6px 10px; }
svg.trend .muted-t { fill: var(--muted); }
svg.trend .avg-t { text-anchor: end; fill: #8a6400; font-weight: 800; }
#print-root { display: none; }
body.show-print #app, body.show-print #modal-root, body.show-print #toast-root { display: none; }
body.show-print #print-root { display: block; background: #fff; min-height: 100vh; }
.print-page { max-width: 1000px; margin: 0 auto; padding: 16px; color: #000; font-size: 13px; }
.print-page h1 { font-size: 22px; margin: 8px 0 2px; }
.print-page h3 { font-size: 15px; margin: 16px 0 4px; }
.print-page .meta { color: #333; margin: 2px 0 8px; }
.print-page .foot { margin-top: 14px; font-size: 11px; color: #555; }
.print-actions { display: flex; gap: 8px; margin-bottom: 8px; }
.print-page .table-scroll { overflow-x: auto; }
table.pt { border-collapse: collapse; width: 100%; font-size: 12px; margin-bottom: 6px; }
table.pt th, table.pt td { border: 1px solid #999; padding: 3px 5px; text-align: center; white-space: nowrap; position: static; background: #fff; color: #000; }
table.pt th { background: #eee; font-size: 11px; text-transform: uppercase; }
table.pt .name { text-align: left; }
table.pt tr.tot td { font-weight: 800; border-top: 2px solid #000; }
table.pt.quarters { width: auto; min-width: 50%; }
@media print {
  @page { size: landscape; margin: 0.4in; }
  body { background: #fff; }
  .print-actions { display: none !important; }
  .print-page { padding: 0; max-width: none; }
}
@media screen and (max-width: 700px) { body.show-print .print-page { overflow-x: auto; } }
.alerts { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.alert { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--warn-bg); color: #6b4300; }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert.out { background: var(--bad); color: #fff; }
.alert.muted-alert { background: #e6eaf1; color: var(--muted); }
.live-note { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.team-fouls { font-size: 13px; opacity: .9; }
.end-game { margin-top: 16px; border: 2px solid var(--bad); }
.access-step { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; margin-top: 14px; }
.step-title { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-grid; place-items: center; font-size: 13px; }
.step-label { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 2px; }
label.check.choice { align-items: flex-start; }
label.check span .muted, label.check.choice span .muted { display: block; font-weight: 400; }
.group-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.group-checks label.check { padding: 6px 0; align-items: flex-start; }
.access-step:has(input[name=see][value=none]:checked) .view-groups { opacity: .35; pointer-events: none; }
.access-help { margin: 4px 0 8px; padding-left: 18px; }
.access-help li { margin-bottom: 4px; }
.invite-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.invite-actions .btn { width: 100%; }
.player-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.side-seg button { flex: 1; padding: 9px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plays .undone .grow { text-decoration: line-through; color: var(--muted); }

.stepper-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.stepper-row:first-of-type { border-top: 0; }
.stepper-row .lbl { flex: 1; font-weight: 600; }
.stepper-row .val { width: 38px; text-align: center; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stepper-row button { width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: #f5f7fb; font-size: 22px; font-weight: 700; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1d2433; color: #fff; padding: 10px 12px 10px 16px; border-radius: 12px; display: flex; gap: 12px; align-items: center; z-index: 60; max-width: calc(100vw - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); font-weight: 600; }
.toast button { color: var(--gold); font-weight: 800; padding: 6px 8px; }
.loading { text-align: center; padding: 60px 16px; color: var(--muted); font-weight: 600; }
.copybox { display: flex; gap: 8px; margin-top: 8px; }
.copybox input { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
.pin { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; letter-spacing: .12em; background: #eef2f8; padding: 2px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="print-root"></div>

<script>
'use strict';
// ===========================================================================
// Basics
// ===========================================================================
const TEAM = '_team';
const $ = sel => document.querySelector(sel);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
};

function call(action, data) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(normErr(err)))
      .api({ action: action, data: data || {}, pin: S.pin });
  });
}
function normErr(err) {
  const raw = String((err && err.message) || err || 'Something went wrong.');
  const e = new Error(raw.replace(/^(Exception|Error):\s*/i, '').replace(/^AUTH:\s*/, ''));
  e.auth = raw.indexOf('AUTH:') >= 0;
  e.network = /network|connection|failed to fetch|timed? ?out|HTTP 0/i.test(raw);
  return e;
}

// ===========================================================================
// Stat math
// ===========================================================================
// REB = rebounds entered before offensive/defensive were split; line().REB is the total of all three.
const BASE = ['GP', 'FG2M', 'FG2A', 'FG3M', 'FG3A', 'FTM', 'FTA', 'OREB', 'DREB', 'REB', 'AST', 'STL', 'BLK', 'TO', 'PF'];
const BASE_LABELS = {
  GP: 'Played (1 = yes)', FG2M: '2PT made', FG2A: '2PT attempts', FG3M: '3PT made', FG3A: '3PT attempts',
  FTM: 'Free throws made', FTA: 'Free throw attempts', OREB: 'Offensive rebounds', DREB: 'Defensive rebounds', REB: 'Rebounds (not split)', AST: 'Assists', STL: 'Steals',
  BLK: 'Blocks', TO: 'Turnovers', PF: 'Fouls',
};
// What each tracker button records.
const TAPS = {
  '2M': { label: '2PT made', ev: [['FG2M', 1], ['FG2A', 1]] },
  '2X': { label: '2PT miss', ev: [['FG2A', 1]] },
  '3M': { label: '3PT made', ev: [['FG3M', 1], ['FG3A', 1]] },
  '3X': { label: '3PT miss', ev: [['FG3A', 1]] },
  'FM': { label: 'Free throw made', ev: [['FTM', 1], ['FTA', 1]] },
  'FX': { label: 'Free throw miss', ev: [['FTA', 1]] },
  'OREB': { label: 'Off. rebound', ev: [['OREB', 1]] },
  'DREB': { label: 'Def. rebound', ev: [['DREB', 1]] },
  'REB': { label: 'Rebound', ev: [['REB', 1]] },
  'AST': { label: 'Assist', ev: [['AST', 1]] },
  'STL': { label: 'Steal', ev: [['STL', 1]] },
  'BLK': { label: 'Block', ev: [['BLK', 1]] },
  'TO': { label: 'Turnover', ev: [['TO', 1]] },
  'PF': { label: 'Foul', ev: [['PF', 1]] },
};

function n0(v) { return Number(v) || 0; }
function line(s) {
  s = s || {};
  const o = {};
  BASE.forEach(k => { o[k] = n0(s[k]); });
  o.rebRaw = o.REB;
  o.REB = o.rebRaw + o.OREB + o.DREB;
  o.pts = 2 * o.FG2M + 3 * o.FG3M + o.FTM;
  o.fgm = o.FG2M + o.FG3M;
  o.fga = o.FG2A + o.FG3A;
  return o;
}

// ===========================================================================
// Offline-safe save queue. Every tap is saved on this device first, then sent.
// Each play has a unique id, so a retry after a dropped connection is never
// double counted by the server.
// ===========================================================================
const Queue = {
  items: store.get('gcs_queue', []),
  busy: false, paused: false, timer: null, delay: 2000, error: '', offline: false, waiters: [],
  save() { store.set('gcs_queue', this.items); updateSync(); },
  push(evs) { this.items = this.items.concat(evs); this.save(); this.flush(); },
  count(gameId) { return this.items.filter(e => !gameId || e.gameId === gameId).length; },
  async flush() {
    if (this.busy || this.paused || !this.items.length || !S.pin) return;
    this.busy = true;
    clearTimeout(this.timer);
    const gameId = this.items[0].gameId, mode = this.items[0].mode || '';
    const batch = this.items.filter(e => e.gameId === gameId && (e.mode || '') === mode).slice(0, 100);
    let ok = false;
    try {
      await call('record', { gameId: gameId, mode: mode, events: batch.map(e => ({ id: e.id, playerId: e.playerId, stat: e.stat, delta: e.delta, time: e.time, fix: !!e.fix, period: e.period })) });
      const sent = new Set(batch.map(e => e.id));
      this.items = this.items.filter(e => !sent.has(e.id));
      this.error = ''; this.offline = false; this.delay = 2000;
      ok = true;
    } catch (err) {
      this.offline = !!err.network;
      this.error = err.network ? '' : err.message;
      if (!err.network) {
        // Don't let one stuck game block plays for another game.
        const stuck = e => e.gameId === gameId && (e.mode || '') === mode;
        this.items = this.items.filter(e => !stuck(e)).concat(this.items.filter(stuck));
      }
      this.timer = setTimeout(() => this.flush(), this.delay);
      this.delay = Math.min(this.delay * 2, 30000);
    }
    this.busy = false;
    this.save();
    this.waiters.splice(0).forEach(f => f());
    if (ok && this.items.length) this.flush();
  },
  idle() { return this.busy ? new Promise(r => this.waiters.push(r)) : Promise.resolve(); },
  async drain(gameId, ms) {
    const until = Date.now() + (ms || 15000);
    while (this.count(gameId) && Date.now() < until) {
      clearTimeout(this.timer); this.busy || this.flush();
      await this.idle();
      if (this.count(gameId)) await new Promise(r => setTimeout(r, 600));
    }
    return this.count(gameId) === 0;
  },
};
window.addEventListener('online', () => Queue.flush());
setInterval(() => Queue.flush(), 15000);
// Live bench view: while a live game is open, pull the latest numbers every few seconds.
const LIVE_REFRESH_MS = 8000;
setInterval(() => {
  const t = S.t;
  if (S.view !== 'game' || !t || t.mode || t.game.status !== 'live' || modalState) return;
  if (document.visibilityState && document.visibilityState !== 'visible') return;
  refreshGameFromServer(true);

function syncInfo() {
  const n = Queue.count();
  if (!n) return { cls: '', text: 'All saved' };
  if (Queue.error) return { cls: 'error', text: n + ' not saved: ' + Queue.error };
  if (Queue.offline) return { cls: 'offline', text: 'Offline · ' + n + ' waiting' };
  return { cls: 'pending', text: 'Saving ' + n + '…' };
}
function syncHtml() { const s = syncInfo(); return '<span class="sync ' + s.cls + '" data-sync>' + esc(s.text) + '</span>'; }

// Read-only official stats for a parent's own players (only when the coach allows it).
// ---------------------------------------------------------------------------
// Player trends: one bar per game for the chosen stat, with the season average as a dashed line.
// ---------------------------------------------------------------------------
const TRENDS = [
  { k: 'pts', l: 'PTS', g: 'scoring', v: l => l.pts },
  { k: 'reb', l: 'REB', g: 'reb', v: l => l.REB },
  { k: 'ast', l: 'AST', g: 'ast', v: l => l.AST },
  { k: 'stl', l: 'STL', g: 'stl', v: l => l.STL },
  { k: 'to', l: 'TO', g: 'to', v: l => l.TO },
  { k: 'pf', l: 'PF', g: 'pf', v: l => l.PF },
  { k: 'fgp', l: 'FG%', g: 'scoring', pct: ['fgm', 'fga'] },
  { k: 'ftp', l: 'FT%', g: 'scoring', pct: ['FTM', 'FTA'] },
];
function trendChart(games) {
  const opts = TRENDS.filter(o => canSeeGroup(o.g)).concat(typeof flowTrends === 'function' ? flowTrends() : []);
  if (games.length < 2 || !opts.length) return '';
  const o = opts.find(x => x.k === S.trendStat) || opts[0];
  const pts = games.map(x => {
    if (o.pct) { const a = x.l[o.pct[1]]; return a ? Math.round(1000 * x.l[o.pct[0]] / a) / 10 : null; }
    return o.v(x.l);
  });
  const vals = pts.filter(v => v != null);
  if (!vals.length) return '';
  let avgV;
  if (o.pct) {
    const m = games.reduce((a, x) => a + x.l[o.pct[0]], 0), at = games.reduce((a, x) => a + x.l[o.pct[1]], 0);
    avgV = at ? 100 * m / at : 0;
  } else avgV = vals.reduce((a, v) => a + v, 0) / vals.length;
  const max = Math.max(o.pct ? 100 : 1, ...vals, avgV);
  const W = 640, H = 260, padL = 20, padB = 48, padT = 28, bw = (W - padL - 8) / games.length;
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const bars = games.map((x, i) => {
    const v = pts[i], cx = padL + i * bw + bw / 2;
    const label = '<text x="' + cx + '" y="' + (H - padB + 20) + '" class="tl">' + esc(fmtDate(x.game.date).replace(/^\w+, /, '')) + '</text>' +
      '<text x="' + cx + '" y="' + (H - padB + 38) + '" class="tl op">' + esc(String(x.game.opponent).slice(0, 10)) + '</text>';
    if (v == null) return label + '<text x="' + cx + '" y="' + (H - padB - 4) + '" class="tv muted-t">–</text>';
    const top = y(v), w = Math.max(6, Math.min(48, bw * 0.6));
    return '<rect x="' + (cx - w / 2) + '" y="' + top + '" width="' + w + '" height="' + Math.max(1, H - padB - top) + '" rx="4" class="bar"/>' +
      '<text x="' + cx + '" y="' + (top - 4) + '" class="tv">' + (o.pct ? v.toFixed(0) + '%' : v) + '</text>' + label;
  }).join('');
  const ay = y(avgV);
  const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="trend" role="img" aria-label="' + esc(o.l) + ' by game">' +
    '<line x1="' + padL + '" x2="' + (W - 4) + '" y1="' + (H - padB) + '" y2="' + (H - padB) + '" class="axis"/>' + bars +
    '<line x1="' + padL + '" x2="' + (W - 4) + '" y1="' + ay + '" y2="' + ay + '" class="avg"/>' +
    '<text x="' + (W - 6) + '" y="' + (ay - 4) + '" class="avg-t">avg ' + (o.pct ? avgV.toFixed(1) + '%' : avgV.toFixed(1)) + '</text></svg>';
  return '<div class="card"><div class="row wrap-row" style="margin-bottom:6px"><h2 style="margin:0;flex:1">Trend</h2></div>' +
    '<div class="seg trend-seg">' + opts.map(x => '<button class="' + (x.k === o.k ? 'on' : '') + '" data-act="trendStat" data-k="' + x.k + '">' + x.l + '</button>').join('') + '</div>' +
    '<div class="trend-wrap">' + svg + '</div><p class="muted small" style="margin:4px 0 0">One bar per game, oldest on the left. Dashed line = season average.</p></div>';
}

function viewMyStats(mine, myStats) {

function periodBar() {
  const t = S.t;
  const max = Math.max(5, t.period + 1);

    btns.push('<button class="' + (n === t.period ? 'on' : '') + '" data-act="period" data-n="' + n + '">' + periodLabel(n) + '</button>');
  }
  const q = (t.periods || {})[t.period] || {};
  const fouls = t.mode ? '' : '<div class="team-fouls">Team fouls ' + periodLabel(t.period) + ': <b>' + esc(shortTeam()) + ' ' + n0(q.usPF) + '</b> · ' + esc(t.game.opponent) + ' ' + n0(q.oppPF) + '</div>';
  return '<div class="period-bar"><div class="inner"><div class="seg period-seg">' + btns.join('') + '</div>' + fouls + '</div></div>';
}

// NFHS: team fouls reset every quarter; the 5th team foul in a quarter puts the other team in the bonus.
const BONUS_FOULS = 5;
function foulAlerts() {
  const t = S.t;
  if (t.mode || !canSeeGroup('pf')) return '';
  const items = [];
  const q = (t.periods || {})[t.period] || {};
  const bonus = (fouls, who) => {
    if (fouls >= BONUS_FOULS) items.push('<span class="alert bad">' + esc(who) + ' in the bonus</span>');
    else if (fouls === BONUS_FOULS - 1) items.push('<span class="alert warn">1 more foul = ' + esc(who) + ' in the bonus</span>');
  };
  if (Object.keys(t.periods || {}).length) {
    bonus(n0(q.oppPF), shortTeam());          // their fouls give US the bonus
    bonus(n0(q.usPF), t.game.opponent);        // our fouls give THEM the bonus
  }
  gamePlayers().forEach(p => {
    const f = n0((t.box[p.id] || {}).PF);
    if (f >= 3) items.push('<span class="alert ' + (f >= 5 ? 'out' : f >= 4 ? 'bad' : 'warn') + '">' + esc(p.number !== '' ? '#' + p.number + ' ' : '') + esc(p.name.split(' ')[0]) + ': ' + (f >= 5 ? 'FOULED OUT' : f + ' fouls') + '</span>');
  });
  oppPlayerList(t.game.oppRoster, t.box).forEach(p => {
    const f = n0((t.box[p.id] || {}).PF);
    if (p.id !== 'opp:team' && f >= 4) items.push('<span class="alert muted-alert">Opp #' + esc(p.number) + ': ' + (f >= 5 ? 'fouled out' : f + ' fouls') + '</span>');
  });
  return items.length ? '<div class="alerts">' + items.join('') + '</div>' : '';
}
function liveNote() {
  const t = S.t;
  if (t.mode || t.game.status !== 'live') return '';
  return '<p class="muted small live-note"><span class="live-dot"></span> Live: updates automatically' + (t.lastSync ? ' · last update ' + new Date(t.lastSync).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }) : '') + '</p>';
}

function endGameButton() {
  const t = S.t;
  if (t.mode || !t.canTrack) return '';
  if (t.game.status === 'final') return '<div class="card small muted" style="text-align:center">This game is final.' + (can('manage') ? ' You can still fix numbers.' : '') + '</div>';
  return '<button class="btn danger big end-game" data-act="endGame">' + (can('manage') ? 'End game (mark final)' : 'Game over: submit final stats') + '</button>';
}

function playRow(p) {
  const who = p.playerId ? anyLabel(p.playerId) : (p.events[0] && p.events[0].stat === 'OPP' ? g_opp() : 'Team');
  return '<div class="list-item ' + (p.undone ? 'undone' : '') + '"><div class="grow"><b>' + esc(who) + '</b> · ' + esc(p.label) +
    '<div class="muted small">' + (p.events[0] && p.events[0].period && !S.t.mode ? periodLabel(p.events[0].period) + ' · ' : '') + esc(new Date(p.time).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })) + '</div></div>' +
    (p.undone ? '<span class="muted small">undone</span>' : '<button class="btn sm" data-act="undo" data-id="' + esc(p.id) + '">Undo</button>') + '</div>';
}

// Every play entered on this phone for this game, newest first, grouped by quarter.
function playsModal() {
  const t = S.t;
  // One group per quarter, latest quarter first; plays newest first inside each.
  const byPer = {};
  t.plays.forEach(p => {
    const per = t.mode ? 0 : ((p.events[0] && p.events[0].period) || 0);
    (byPer[per] = byPer[per] || []).push(p);
  });
  const groups = Object.keys(byPer).map(Number).sort((a, b) => (b || -1) - (a || -1))
    .map(n => ({ label: t.mode ? 'Plays' : (n ? periodLabel(n) : 'No quarter'), plays: byPer[n] }));
  const live = t.plays.filter(p => !p.undone).length;
  openModal('<h2>All plays</h2><p class="muted small" style="margin-top:4px">' + live + ' play' + (live === 1 ? '' : 's') + ' entered on this phone, newest first. Undo any of them; it comes off the quarter it happened in.</p>' +
    (groups.length ? groups.map(g => '<div class="section-title">' + esc(g.label) + '</div><div class="plays">' + g.plays.map(playRow).join('') + '</div>').join('') : '<div class="empty">No plays yet.</div>') +
    '<div class="form-actions"><button class="btn primary" data-act="closeModal">Done</button></div>', { plays: true });
}

function viewTracker() {
  const t = S.t;
  const ps = onCourtPlayers();
  const opp = t.side === 'opp';
  const sel = t.sel && findAnyPlayer(t.sel);
  const armed = t.armed && TAPS[t.armed];
  let hint;
  if (sel) hint = '<b>' + esc(anyLabel(sel.id)) + '</b>: tap a stat';
  else if (armed) hint = '<b>' + esc(armed.label) + '</b>: tap the player';
  else hint = opp ? 'Tracking <b>' + esc(t.game.opponent) + '</b>: tap a number, then a stat' : 'Tap a player, then a stat';
  const tiles = ps.map(p => {
    const l = line(t.box[p.id]);
    const fc = l.PF >= 5 ? 'foul5' : l.PF >= 4 ? 'foul4' : '';
    return '<button class="pbtn ' + (p.id === t.sel ? 'sel' : '') + '" data-act="pickPlayer" data-id="' + esc(p.id) + '">' +
      '<div class="n">' + (p.number !== '' ? '#' + esc(p.number) : (p.id === 'opp:team' ? 'TEAM' : '–')) + '</div>' +
      '<div class="nm">' + esc(p.id === 'opp:team' ? 'Unknown #' : p.name) + '</div>' +
      '<div class="ln">' + l.pts + ' pts · <span class="' + fc + '">' + l.PF + ' F</span></div></button>';
  }).join('');
  const b = (code, top, bottom, cls) => '<button class="sbtn ' + (cls || '') + (t.armed === code ? ' armed' : '') + '" data-act="stat" data-code="' + code + '">' + top + (bottom ? '<small>' + bottom + '</small>' : '') + '</button>';
  // Only the stat buttons this person is allowed to enter.
  const ok = code => canTrackGroup(TAP_GROUP[code]);
  const btns = [['2M', '2PT', 'MADE', 'make'], ['2X', '2PT', 'MISS', 'miss'], ['3M', '3PT', 'MADE', 'make'], ['3X', '3PT', 'MISS', 'miss'],
    ['FM', 'FT', 'MADE', 'make'], ['FX', 'FT', 'MISS', 'miss'], ['OREB', 'O-REB', 'OFFENSE'], ['DREB', 'D-REB', 'DEFENSE'],
    ['AST', 'AST'],
    ['STL', 'STL'], ['BLK', 'BLK'], ['TO', 'TO', 'TURNOVER'], ['PF', 'FOUL']].filter(x => ok(x[0]));
  const limited = btns.length < 13;
  const pad = (limited ? '<p class="muted small" style="text-align:center;margin:10px 0 0">You\'re entering: <b>' + esc(TRACK_GROUP_KEYS.filter(canTrackGroup).filter(g => g !== 'opp').map(groupName).join(', ') || 'no stats') + '</b></p>' : '') +
    (btns.length ? '<div class="pad">' + btns.map(x => b(x[0], x[1], x[2], x[3])).join('') + '</div>' : '<div class="card empty">The coach hasn\'t given you any stats to enter.</div>');
  const plays = t.plays.slice(0, 6);
  const playsHtml = plays.length ? plays.map(playRow).join('') +
    '<button class="btn big" style="margin-top:10px" data-act="allPlays">All plays this game (' + t.plays.length + ')</button>'
    : '<div class="muted small" style="padding:8px 0">Plays you enter will show here so you can undo mistakes.</div>';
  const sideToggle = isPersonal() || !canTrackGroup('opp') ? '' : '<div class="row" style="margin-top:12px"><div class="seg side-seg">' +
    '<button class="' + (opp ? '' : 'on') + '" data-act="side" data-side="us">' + esc(shortTeam()) + '</button>' +
    '<button class="' + (opp ? 'on' : '') + '" data-act="side" data-side="opp">' + esc(t.game.opponent) + '</button></div></div>';
  const oppNote = opp && !(t.game.oppRoster || []).length
    ? '<div class="note">Add their jersey numbers to track individuals, or just use <b>TEAM</b> for all of them.</div>' : '';
  return foulAlerts() + sideToggle + '<div class="hint">' + hint + '</div>' + oppNote +
    (ps.length ? '<div class="players">' + tiles + '</div>' : '<div class="card empty">No players on the roster yet.</div>') +
    pad +
    '<div class="row" style="margin-top:12px">' + (opp ? '<button class="btn sm" data-act="oppRoster">Opponent numbers</button>' : '<button class="btn sm" data-act="whosHere">Who\'s playing?</button>') + '<span class="spacer"></span>' +
    (t.sel || t.armed ? '<button class="btn sm" data-act="clearSel">Cancel selection</button>' : '') + '</div>' +
    '<div class="card plays"><h2>Recent plays</h2>' + playsHtml + '</div>' +
    endGameButton();
}
function shortTeam() { return S.teamName.length <= 12 ? S.teamName : (S.teamName.split(/\s+/)[0] || 'Us').slice(0, 14); }
function g_opp() { return S.t ? S.t.game.opponent : 'Opponent'; }

function boxTable(players, box, clickable, opp) {
  const rows = players.filter(p => played(box[p.id]));
  if (!opp) rows.sort(byNumber);
  let tot = {};
  const tr = rows.map(p => {
    const s = box[p.id] || {};
    tot = addLine(tot, s);
    const l = line(s);
    return '<tr class="' + (clickable ? 'click' : '') + '" ' + (clickable ? 'data-act="editLine" data-id="' + esc(p.id) + '"' : '') + '>' +
      '<td><span class="pnum">' + (p.number !== '' ? '#' + esc(p.number) : '') + '</span><span class="pname">' + esc(p.id === 'opp:team' ? 'Team / unknown #' : p.name) + '</span></td>' +
      boxCells(l) + '</tr>';
  }).join('');
  const lt = line(tot);
  return '<div class="table-wrap"><table><thead><tr><th>Player</th>' + boxHead() + '</tr></thead><tbody>' +
    (tr || '<tr><td colspan="12" class="muted" style="text-align:center;position:static">No stats yet</td></tr>') +
    (rows.length ? '<tr class="total"><td>Team</td>' + boxCells(lt) + '</tr>' : '') +
    '</tbody></table></div>';
}
// Box score columns, each tied to a stat group so people only see what the coach allows.
const BOX_COLS = [
  ['PTS', 'scoring', l => '<b>' + l.pts + '</b>'], ['FG', 'scoring', l => l.fgm + '-' + l.fga], ['FG%', 'scoring', l => pct(l.fgm, l.fga)],
  ['3P', 'scoring', l => l.FG3M + '-' + l.FG3A], ['FT', 'scoring', l => l.FTM + '-' + l.FTA],
  ['REB', 'reb', l => l.REB], ['OR', 'reb', l => l.OREB], ['DR', 'reb', l => l.DREB], ['AST', 'ast', l => l.AST], ['STL', 'stl', l => l.STL], ['BLK', 'blk', l => l.BLK], ['TO', 'to', l => l.TO], ['PF', 'pf', l => l.PF],
];
const boxCols = () => BOX_COLS.filter(c => canSeeGroup(c[1]));
function boxHead() { return boxCols().map(c => '<th>' + c[0] + '</th>').join(''); }
function boxCells(l) { return boxCols().map(c => '<td>' + c[2](l) + '</td>').join(''); }
// Stat tiles (PPG, RPG…) filtered the same way.
function statTiles(l, gp, which) {
  const all = { PPG: ['scoring', () => avg(l.pts, gp)], RPG: ['reb', () => avg(l.REB, gp)], APG: ['ast', () => avg(l.AST, gp)], SPG: ['stl', () => avg(l.STL, gp)],
    'FG%': ['scoring', () => pct(l.fgm, l.fga)], '3P%': ['scoring', () => pct(l.FG3M, l.FG3A)], 'FT%': ['scoring', () => pct(l.FTM, l.FTA)], 'TO/G': ['to', () => avg(l.TO, gp)] };
  return which.filter(k => canSeeGroup(all[k][0])).map(k => '<div class="tile"><div class="label">' + k + '</div><div class="value">' + all[k][1]() + '</div></div>').join('');
}

function viewPersonalBox() {
  const t = S.t, g = t.game;
  return '<div class="card"><div class="row"><h2 class="grow" style="flex:1">' + esc(fmtDate(g.date)) + '</h2>' + statusChip(g.status) + '</div>' +
    '<p class="muted small" style="margin:0 0 8px">Your own numbers. Tap a player to fix them.</p>' +
    boxTable(t.players, t.box, true) +
    '</div><div class="card small">This record goes to the coach to compare with the official stats. There\'s nothing to submit. You can come back and fix it until the game is final.</div>';
}

// Coach: each player-parent's record next to the official numbers.
function parentBooksCard() {
  const t = S.t;
  if (!t.parentBooks || !t.parentBooks.length) return '';
  const cols = l => [l.pts, l.fgm + '-' + l.fga, l.FG3M + '-' + l.FG3A, l.FTM + '-' + l.FTA, l.REB, l.AST, l.STL, l.BLK, l.TO, l.PF];
  const head = '<tr><th>Player</th><th>By</th><th>PTS</th><th>FG</th><th>3P</th><th>FT</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th><th>PF</th></tr>';
  const rows = [];
  t.parentBooks.forEach(b => {
    Object.keys(b.box).forEach(pid => {
      if (!hasAny(b.box[pid])) return;
      const p = t.players.find(x => x.id === pid) || { number: '', name: 'Player' };
      const off = cols(line(t.box[pid])), mine = cols(line(b.box[pid]));
      rows.push('<tr><td rowspan="2"><span class="pnum">' + (p.number !== '' ? '#' + esc(p.number) : '') + '</span><span class="pname">' + esc(p.name) + '</span></td><td class="muted">Official</td>' +
        off.map(v => '<td>' + v + '</td>').join('') + '</tr>' +
        '<tr class="book-row"><td class="muted">' + esc(b.name.split(' ')[0]) + '</td>' + mine.map((v, i) => '<td class="' + (String(v) !== String(off[i]) ? 'diff' : '') + '">' + v + '</td>').join('') + '</tr>');
    });
  });
  if (!rows.length) return '';
  return '<div class="card"><h2>Parent records</h2><p class="muted small" style="margin-top:0">Numbers kept separately by parents assigned to specific players. Highlighted cells differ from the official stats. These never change the official stats.</p>' +
    '<div class="table-wrap"><table class="compare"><thead>' + head + '</thead><tbody>' + rows.join('') + '</tbody></table></div></div>';
}

function viewGameBox(coach) {
  const t = S.t, g = t.game;
  if (isPersonal()) return viewPersonalBox();
  const unplayed = t.canFix && (!t.boxFilter || t.boxFilter === 'all') ? gamePlayers().filter(p => !played(t.box[p.id])) : [];
  const opps = oppPlayerList(g.oppRoster, t.box);
  const fb = filteredBox();
  const quick = n0(fb[TEAM] && fb[TEAM].OPP);
  const oppBox = filteredBox(), oppWhole = !t.boxFilter || t.boxFilter === 'all';
  const oppCard = (hasOppStats(oppBox) || (oppWhole && t.canFix && (g.oppRoster || []).length))
    ? '<div class="card"><h2>' + esc(g.opponent) + (oppWhole ? '' : ' · ' + (t.boxFilter === 'ot' ? 'OT' : periodLabel(Number(t.boxFilter)))) + '</h2>' + boxTable(opps, oppBox, t.canFix && oppWhole, true) +
      (quick ? '<p class="muted small">Plus ' + quick + ' point' + (quick === 1 ? '' : 's') + ' from the quick +1/+2/+3 buttons.</p>' : '') +
      (t.canFix ? '<div class="row wrap-row" style="margin-top:8px">' + opps.filter(p => !hasAny(t.box[p.id])).map(p => '<button class="btn sm" data-act="editLine" data-id="' + esc(p.id) + '">' + esc(p.number !== '' ? '#' + p.number : 'Team') + '</button>').join('') + '</div>' : '') +
      '</div>'
    : '';
  let statusHtml;
  if (!t.canTrack) {
    statusHtml = '';
  } else if (coach) {
    statusHtml = (g.status !== 'final' ? endGameButton() + '<p class="muted small">Or set the status directly:</p>' : '') +
      '<div class="row wrap-row"><span class="muted small">Status</span><div class="seg">' +
      ['scheduled', 'live', 'final'].map(s => '<button class="' + (g.status === s ? 'on' : '') + '" data-act="setStatus" data-s="' + s + '">' + (s === 'scheduled' ? 'Upcoming' : s[0].toUpperCase() + s.slice(1)) + '</button>').join('') + '</div></div>';
  } else {
    statusHtml = '<button class="btn primary big" data-act="endGame">Game over: submit final stats</button>' +
      '<p class="muted small">After you submit, the stats go to the coach and this game closes on your phone.</p>';
  }
  const whole = !t.boxFilter || t.boxFilter === 'all';
  const shown = filteredBox();
  return '<div class="card"><div class="row"><h2 class="grow" style="flex:1">' + esc(fmtDate(g.date)) + '</h2>' + statusChip(g.status) + '</div>' +
    liveNote() + foulAlerts() + boxFilterBar() +
    (whole ? (t.canFix ? '<p class="muted small" style="margin:0 0 8px">Tap a player to fix their numbers.</p>' : '')
      : '<p class="muted small" style="margin:0 0 8px">Showing ' + (t.boxFilter === 'ot' ? 'overtime' : periodLabel(Number(t.boxFilter))) + ' only (' + shortTeam() + ' ' + teamPts(shown) + ', ' + esc(g.opponent) + ' ' + oppPts(shown) + '). Tap Game to fix numbers.</p>') +
    boxTable(t.players, shown, t.canFix && whole) +
    (unplayed.length ? '<div class="row wrap-row" style="margin-top:12px"><span class="muted small">Add a player:</span>' + unplayed.map(p => '<button class="btn sm" data-act="editLine" data-id="' + esc(p.id) + '">' + esc(playerLabel(p)) + '</button>').join('') + '</div>' : '') +
    '</div>' + quarterCard() + oppCard + parentBooksCard() + (statusHtml ? '<div class="card">' + statusHtml + '</div>' : '') +
    (S.me.role === 'coach' ? '<button class="btn big" style="margin-top:12px" data-act="printBox">🖨 Printable box score</button>' : '');
}

// ---------------------------------------------------------------------------
// Printable box score (coach only): a clean black-and-white page to print or save as PDF.
// ---------------------------------------------------------------------------
function printTable(title, players, box, extraCols) {
  const cols = [['PTS', l => l.pts], ['FG', l => l.fgm + '-' + l.fga], ['FG%', l => pct(l.fgm, l.fga)], ['3P', l => l.FG3M + '-' + l.FG3A],
    ['FT', l => l.FTM + '-' + l.FTA], ['OR', l => l.OREB], ['DR', l => l.DREB], ['REB', l => l.REB], ['AST', l => l.AST], ['STL', l => l.STL],
    ['BLK', l => l.BLK], ['TO', l => l.TO], ['PF', l => l.PF]].concat(extraCols || []);
  const rows = players.filter(p => played(box[p.id]));
  let tot = {};
  const body = rows.map(p => {
    tot = addLine(tot, box[p.id]);
    const l = line(box[p.id]);
    l.id = p.id;
    return '<tr><td class="num">' + esc(p.number) + '</td><td class="name">' + esc(p.id === 'opp:team' ? 'Team / unknown #' : p.name) + '</td>' + cols.map(c => '<td>' + c[1](l) + '</td>').join('') + '</tr>';
  }).join('');
  const lt = line(tot);
  lt.id = '_total';
  return '<h3>' + esc(title) + '</h3><div class="table-scroll"><table class="pt"><thead><tr><th>#</th><th class="name">Player</th>' + cols.map(c => '<th>' + c[0] + '</th>').join('') + '</tr></thead><tbody>' +
    (body || '<tr><td colspan="' + (cols.length + 2) + '">No stats</td></tr>') +
    (rows.length ? '<tr class="tot"><td></td><td class="name">Totals</td>' + cols.map(c => '<td>' + c[1](lt) + '</td>').join('') + '</tr>' : '') + '</tbody></table></div>';
}

function printBox() {
  const t = S.t, g = t.game;
  const us = teamPts(t.box), them = oppPts(t.box);
  const ns = Object.keys(t.periods || {}).map(Number).filter(n => n > 0);
  for (let n = 1; n <= 4; n++) if (ns.indexOf(n) < 0) ns.push(n);
  ns.sort((a, b) => a - b);
  const hasQ = Object.keys(t.periods || {}).length > 0;
  const q = (n, k) => n0(((t.periods || {})[n] || {})[k]);
  const quarters = hasQ ? '<table class="pt quarters"><thead><tr><th class="name">Team</th>' + ns.map(n => '<th>' + periodLabel(n) + '</th>').join('') + '<th>Final</th></tr></thead><tbody>' +
    '<tr><td class="name">' + esc(S.teamName) + '</td>' + ns.map(n => '<td>' + q(n, 'us') + '</td>').join('') + '<td><b>' + us + '</b></td></tr>' +
    '<tr><td class="name">' + esc(g.opponent) + '</td>' + ns.map(n => '<td>' + q(n, 'opp') + '</td>').join('') + '<td><b>' + them + '</b></td></tr></tbody></table>' : '';
  const extra = typeof flowCols === 'function' ? flowCols(t) : [];
  const opps = oppPlayerList(g.oppRoster, t.box);
  const result = g.status === 'final' ? (us > them ? 'W' : us < them ? 'L' : 'T') + ' ' : '';
  $('#print-root').innerHTML = '<div class="print-page">' +
    '<div class="print-actions"><button class="btn primary" data-act="doPrint">Print / Save as PDF</button><button class="btn" data-act="closePrint">Close</button></div>' +
    '<h1>' + esc(S.teamName) + ' ' + us + ', ' + esc(g.opponent) + ' ' + them + '</h1>' +
    '<p class="meta">' + esc(result) + esc(fmtDate(g.date)) + ' · ' + esc(g.location === 'away' ? 'Away' : g.location === 'neutral' ? 'Neutral site' : 'Home') +
    (g.status === 'final' ? ' · Final' : ' · In progress') + (S.data && S.data.settings.season ? ' · ' + esc(S.data.settings.season) + ' season' : '') + '</p>' +
    quarters +
    printTable(S.teamName, gamePlayers(), t.box, extra) +
    (hasOppStats(t.box) ? printTable(g.opponent, opps, t.box) : '') +
    (n0(t.box[TEAM] && t.box[TEAM].OPP) ? '<p class="meta">' + esc(g.opponent) + ' points not credited to a player: ' + n0(t.box[TEAM].OPP) + '</p>' : '') +
    '<p class="meta foot">OR/DR = offensive/defensive rebounds. Printed ' + esc(new Date().toLocaleString()) + '.</p></div>';
  document.body.classList.add('show-print');
  window.scrollTo(0, 0);
}

function quarterCard() {
  const t = S.t;
  const ns = Object.keys(t.periods || {}).map(Number).filter(n => n > 0).sort((a, b) => a - b);
  if (!ns.length) return '';
  for (let n = 1; n <= 4; n++) if (ns.indexOf(n) < 0) ns.push(n);
  ns.sort((a, b) => a - b);
  const cell = (n, k) => n0(((t.periods || {})[n] || {})[k]);
  const row = (label, k, total) => '<tr><td>' + esc(label) + '</td>' + ns.map(n => '<td>' + cell(n, k) + '</td>').join('') + '<td><b>' + total + '</b></td></tr>';
  const pts = canSeeGroup('scoring'), fouls = canSeeGroup('pf');
  if (!pts && !fouls) return '';
  return '<div class="card"><h2>By quarter</h2><div class="table-wrap"><table>' +
    (pts ? '<thead><tr><th>Points</th>' + ns.map(n => '<th>' + periodLabel(n) + '</th>').join('') + '<th>Total</th></tr></thead><tbody>' +
      row(shortTeam(), 'us', teamPts(t.box)) + row(t.game.opponent, 'opp', oppPts(t.box)) + '</tbody>' : '') +
    (fouls ? '<thead><tr><th>Team fouls</th>' + ns.map(n => '<th>' + periodLabel(n) + '</th>').join('') + '<th></th></tr></thead><tbody>' +
      row(shortTeam(), 'usPF', '') + row(t.game.opponent, 'oppPF', '') + '</tbody>' : '') +
    '</table></div>' +
    (pts && Object.keys(t.box).some(k => k !== TEAM && hasAny(t.box[k])) && ns.reduce((a, n) => a + cell(n, 'us'), 0) !== teamPts(t.box)
      ? '<p class="muted small">Some points were entered before quarters were tracked, so quarters may not add up to the total.</p>' : '') + '</div>';
}

// Coach

function coachTabList() {
  const tabs = [['season', 'Season'], ['games', 'Games']];
  if (can('manage')) tabs.push(['roster', 'Roster']);
  if (S.me.role === 'coach') tabs.push(['parents', 'Access']);
  return tabs;
}
function coachTabs() {
  const tabs = coachTabList();
  return '<div class="tabs">' + tabs.map(([k, l]) => '<button class="' + (S.tab === k ? 'on' : '') + '" data-act="tab" data-tab="' + k + '">' + l + '</button>').join('') + '</div>';
}
function viewCoach() {
  const right = '<button class="link" data-act="refresh">Refresh</button><button class="link" data-act="logout">Sign out</button>';
  let body;
  if (S.tab === 'season') body = viewSeason();
  else if (S.tab === 'games') body = viewGames();
  else if (S.tab === 'roster' && can('manage')) body = viewRoster();
  else if (S.tab === 'parents' && S.me.role === 'coach') body = viewParents();
  else body = viewSeason();
  const title = S.me.role === 'coach' ? S.teamName : S.teamName + ' · ' + S.me.name;
  return topBar(title, '', right, coachTabs()) + '<div class="wrap">' + body + '</div>';
}

function gamesWithStats() {
  const d = S.data;
  return d.games.filter(g => d.boxes[g.id] && Object.keys(d.boxes[g.id]).some(k => k !== TEAM && !isOpp(k) && played(d.boxes[g.id][k])))
    .sort((a, b) => a.date.localeCompare(b.date));
}

function seasonTable() {
  const d = S.data;
  const games = gamesWithStats();
  return d.players.map(p => {
    let tot = {}, gp = 0;
    games.forEach(g => {
      const s = d.boxes[g.id][p.id];
      if (played(s)) { gp++; tot = addLine(tot, s); }
    });
    return { p: p, gp: gp, l: line(tot) };
  }).filter(r => r.gp || r.p.active);
}

function teamRecord() {
  const d = S.data;
  let w = 0, l = 0, pf = 0, pa = 0, n = 0;
  d.games.filter(g => g.status === 'final').forEach(g => {
    const box = d.boxes[g.id] || {};
    const us = teamPts(box), them = oppPts(box);
    pf += us; pa += them; n++;
    if (us > them) w++; else if (us < them) l++;
  });
  return { w: w, l: l, ppg: n ? (pf / n).toFixed(1) : '–', oppg: n ? (pa / n).toFixed(1) : '–', n: n };
}

const SEASON_COLS = [
  { k: 'gp', l: 'GP', v: r => r.gp, raw: true },
  { k: 'pts', g: 'scoring', l: 'PTS', v: r => r.l.pts },
  { k: 'reb', g: 'reb', l: 'REB', v: r => r.l.REB },
  { k: 'oreb', g: 'reb', l: 'OREB', v: r => r.l.OREB },
  { k: 'dreb', g: 'reb', l: 'DREB', v: r => r.l.DREB },
  { k: 'ast', g: 'ast', l: 'AST', v: r => r.l.AST },
  { k: 'stl', g: 'stl', l: 'STL', v: r => r.l.STL },
  { k: 'blk', g: 'blk', l: 'BLK', v: r => r.l.BLK },
  { k: 'to', g: 'to', l: 'TO', v: r => r.l.TO },
  { k: 'fg', g: 'scoring', l: 'FG', v: r => r.l.fgm, pair: r => [r.l.fgm, r.l.fga] },
  { k: 'fgp', g: 'scoring', l: 'FG%', v: r => (r.l.fga ? r.l.fgm / r.l.fga : -1), pct: r => pct(r.l.fgm, r.l.fga) },
  { k: '3p', g: 'scoring', l: '3P', v: r => r.l.FG3M, pair: r => [r.l.FG3M, r.l.FG3A] },
  { k: '3pp', g: 'scoring', l: '3P%', v: r => (r.l.FG3A ? r.l.FG3M / r.l.FG3A : -1), pct: r => pct(r.l.FG3M, r.l.FG3A) },
  { k: 'ft', g: 'scoring', l: 'FT', v: r => r.l.FTM, pair: r => [r.l.FTM, r.l.FTA] },
  { k: 'ftp', g: 'scoring', l: 'FT%', v: r => (r.l.FTA ? r.l.FTM / r.l.FTA : -1), pct: r => pct(r.l.FTM, r.l.FTA) },
  { k: 'pf', g: 'pf', l: 'PF', v: r => r.l.PF },
];
function colText(c, r, perGame) {
  if (c.pct) return c.pct(r);
  if (c.raw) return String(c.v(r));
  if (c.pair) { const [m, a] = c.pair(r); return perGame ? avg(m, r.gp) + '-' + avg(a, r.gp) : m + '-' + a; }
  return perGame ? avg(c.v(r), r.gp) : String(c.v(r));
}
function sortVal(c, r, perGame) {
  if (c.pct || c.raw) return c.v(r);
  return perGame ? (r.gp ? c.v(r) / r.gp : -1) : c.v(r);
}

function viewSeason() {
  const d = S.data;
  if (!d.players.length) {
    return can('manage') ? '<div class="card empty" style="margin-top:16px"><h2>Welcome, Coach!</h2><p>Start by adding your players on the <b>Roster</b> tab, then add parents and games.</p>' +
      '<button class="btn primary" data-act="tab" data-tab="roster">Add players</button></div>' : '<div class="card empty">No stats yet.</div>';
  }
  const rec = teamRecord();
  const rows = seasonTable();
  const perGame = S.seasonMode === 'avg';
  const cols = SEASON_COLS.filter(c => !c.g || canSeeGroup(c.g));
  const leaders = [['PTS', 'scoring', r => r.l.pts], ['REB', 'reb', r => r.l.REB], ['AST', 'ast', r => r.l.AST], ['STL', 'stl', r => r.l.STL]].filter(x => canSeeGroup(x[1])).map(([lbl, , f]) => {
    const best = rows.filter(r => r.gp).sort((a, b) => f(b) / b.gp - f(a) / a.gp)[0];
    return '<div class="tile"><div class="label">' + lbl + ' leader</div><div class="value">' + (best ? avg(f(best), best.gp) : '–') + '</div><div class="sub">' + (best ? esc(playerLabel(best.p)) : 'No games yet') + '</div></div>';
  }).join('');
  const col = cols.find(c => c.k === S.sort.key) || cols[1] || cols[0];
  rows.sort((a, b) => (sortVal(col, a, perGame) - sortVal(col, b, perGame)) * S.sort.dir || byNumber(a.p, b.p));
  const head = '<tr><th>Player</th>' + cols.map(c => '<th class="sortable ' + (c.k === col.k ? 'sorted' : '') + '" data-act="sort" data-k="' + c.k + '">' + c.l + (c.k === col.k ? (S.sort.dir < 0 ? ' ▾' : ' ▴') : '') + '</th>').join('') + '</tr>';
  const body = rows.map(r => '<tr class="click" data-act="openPlayer" data-id="' + esc(r.p.id) + '"><td><span class="pnum">' + (r.p.number !== '' ? '#' + esc(r.p.number) : '') + '</span><span class="pname">' + esc(r.p.name) + '</span></td>' +
    cols.map(c => '<td>' + (c.k === 'pts' ? '<b>' + colText(c, r, perGame) + '</b>' : colText(c, r, perGame)) + '</td>').join('') + '</tr>').join('');
  const nGames = gamesWithStats().length;
  return '<div class="tiles">' +
    (canSeeGroup('scoring') ? '<div class="tile"><div class="label">Record</div><div class="value">' + rec.w + '–' + rec.l + '</div><div class="sub">' + rec.n + ' final game' + (rec.n === 1 ? '' : 's') + '</div></div>' +
      '<div class="tile"><div class="label">Points / game</div><div class="value">' + rec.ppg + '</div><div class="sub">Allowed ' + rec.oppg + '</div></div>' : '') +
    leaders + '</div>' +
    '<div class="card"><div class="row wrap-row" style="margin-bottom:8px"><h2 style="margin:0;flex:1">Player stats</h2>' +
    '<div class="seg"><button class="' + (perGame ? 'on' : '') + '" data-act="seasonMode" data-m="avg">Per game</button><button class="' + (!perGame ? 'on' : '') + '" data-act="seasonMode" data-m="tot">Totals</button></div></div>' +
    '<p class="muted small" style="margin:0 0 6px">' + nGames + ' game' + (nGames === 1 ? '' : 's') + ' with stats. Tap a column to sort, or a player to see their game log.</p>' +
    '<div class="table-wrap"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></div>' +
    oppComparison() +
    (S.me.role !== 'coach' ? '' : '<div class="card"><h2>Google Sheet</h2><p class="muted small" style="margin-top:0">Copy these numbers into <b>Season Stats</b> and <b>Game Log</b> tabs in your spreadsheet to sort, chart, or print.</p>' +
    '<div class="row wrap-row"><button class="btn primary" data-act="writeReport">Update stats in Google Sheet</button>' +
    (d.sheetUrl ? '<a class="btn" href="' + esc(d.sheetUrl) + '" target="_blank" rel="noopener">Open spreadsheet</a>' : '') + '</div></div>');
}

// Us vs. opponents, using only games where opponent stats were tracked.
function oppComparison() {
  const d = S.data;
  const games = gamesWithStats().filter(g => hasOppStats(d.boxes[g.id]));
  if (!games.length) return '';
  let us = {}, them = {}, usPts = 0, themPts = 0;
  games.forEach(g => {
    const b = d.boxes[g.id];
    us = addLine(us, sideTotals(b, false)); them = addLine(them, sideTotals(b, true));
    usPts += teamPts(b); themPts += oppPts(b);
  });
  const n = games.length, a = line(us), o = line(them);
  const rows = [
    ['Points', avg(usPts, n), avg(themPts, n), 'scoring'],
    ['FG%', pct(a.fgm, a.fga), pct(o.fgm, o.fga), 'scoring'],
    ['3P%', pct(a.FG3M, a.FG3A), pct(o.FG3M, o.FG3A), 'scoring'],
    ['3PM', avg(a.FG3M, n), avg(o.FG3M, n), 'scoring'],
    ['FT%', pct(a.FTM, a.FTA), pct(o.FTM, o.FTA), 'scoring'],
    ['FTA', avg(a.FTA, n), avg(o.FTA, n), 'scoring'],
    ['Rebounds', avg(a.REB, n), avg(o.REB, n), 'reb'],
    ['Assists', avg(a.AST, n), avg(o.AST, n), 'ast'],
    ['Steals', avg(a.STL, n), avg(o.STL, n), 'stl'],
    ['Blocks', avg(a.BLK, n), avg(o.BLK, n), 'blk'],
    ['Turnovers', avg(a.TO, n), avg(o.TO, n), 'to'],
    ['Fouls', avg(a.PF, n), avg(o.PF, n), 'pf'],
  ].filter(r => canSeeGroup(r[3]));
  if (!rows.length) return '';
  return '<div class="card"><h2>Us vs. opponents</h2><p class="muted small" style="margin-top:0">Per game, from the ' + n + ' game' + (n === 1 ? '' : 's') + ' where opponent stats were kept.</p>' +
    '<div class="table-wrap"><table><thead><tr><th>Per game</th><th>' + esc(shortTeam()) + '</th><th>Opponents</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + r[0] + '</td><td><b>' + r[1] + '</b></td><td>' + r[2] + '</td></tr>').join('') + '</tbody></table></div></div>';
}

function viewPlayer() {
  const d = S.data;
  const p = d.players.find(x => x.id === S.playerId);
  if (!p) { S.view = 'coach'; return viewCoach(); }
  const games = gamesWithStats().filter(g => played(d.boxes[g.id][p.id]));
  let tot = {};
  games.forEach(g => { tot = addLine(tot, d.boxes[g.id][p.id]); });
  const l = line(tot), gp = games.length;
  const tiles = statTiles(l, gp, ['PPG', 'RPG', 'APG', 'SPG', 'FG%', '3P%', 'FT%', 'TO/G']);
  const rows = games.slice().reverse().map(g => {
    const gl = line(d.boxes[g.id][p.id]);

    '<div class="card"><h2>Game log</h2><p class="muted small" style="margin-top:0">' + gp + ' game' + (gp === 1 ? '' : 's') + ' played · ' + l.pts + ' points total</p>' +
    '<div class="table-wrap"><table><thead><tr><th>Game</th>' + boxHead() + '</tr></thead><tbody>' +
    (rows || '<tr><td colspan="12" class="muted">No games yet</td></tr>') +

}

function parentName(id) {
  const p = S.data.parents.find(x => x.id === id);
  return p ? p.name : '';
}

function viewGames() {
  const d = S.data;
  const games = d.games.slice().sort((a, b) => b.date.localeCompare(a.date));
  const upcoming = games.filter(g => g.status !== 'final').reverse();
  const done = games.filter(g => g.status === 'final');
  const card = g => {
    const box = d.boxes[g.id] || {};
    const us = teamPts(box), them = oppPts(box);
    const showScore = canSeeGroup('scoring');
    const result = g.status === 'final' && showScore ? (us > them ? '<span class="chip win">W</span>' : us < them ? '<span class="chip loss">L</span>' : '<span class="chip">T</span>') : statusChip(g.status);
    const scorer = (g.scorerIds || []).map(parentName).filter(Boolean).join(', ');
    return '<div class="card"><div class="row"><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:17px">' + esc(gameTitle(g)) + '</div>' +
      '<div class="muted small">' + esc(fmtDate(g.date)) + ' · Stats: ' + (scorer ? esc(scorer) : '<b>no parent assigned</b>') + '</div></div>' +
      '<div style="text-align:right">' + result + (g.status !== 'scheduled' && showScore ? '<div style="font-weight:800;font-size:18px;margin-top:2px">' + us + '–' + them + '</div>' : '') + '</div></div>' +
      '<div class="row wrap-row" style="margin-top:10px">' +
      (canTrackGame(g) ? '<button class="btn sm primary" data-act="openGame" data-id="' + esc(g.id) + '">Track</button>' : '') +
      (g.status !== 'final' && S.me.players && S.me.players.length ? '<button class="btn sm" data-act="openPersonal" data-id="' + esc(g.id) + '">Track my player</button>' : '') +
      '<button class="btn sm" data-act="openBox" data-id="' + esc(g.id) + '">Box score</button>' +
      (can('manage') ? '<button class="btn sm" data-act="editGame" data-id="' + esc(g.id) + '">Edit</button>' : '') + '</div></div>';
  };
  return (can('manage') ? '<div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn" data-act="bulkGames">Add many</button><button class="btn primary" data-act="editGame">+ New game</button></div>' : '') +
    '<div class="section-title">Upcoming &amp; in progress</div>' + (upcoming.length ? upcoming.map(card).join('') : '<div class="card empty">No upcoming games.</div>') +
    (done.length ? '<div class="section-title">Final</div>' + done.map(card).join('') : '');
}

function viewRoster() {

// Stat groups the coach can allow per person (same keys as the server's STAT_GROUPS).
const GROUPS = [
  ['scoring', 'Points & shooting', '2PT, 3PT, free throws'],
  ['reb', 'Rebounds'], ['ast', 'Assists'], ['stl', 'Steals'], ['blk', 'Blocks'], ['to', 'Turnovers'], ['pf', 'Fouls'],
  ['opp', "Opponent's stats & score"],
];
const VIEW_GROUP_KEYS = ['scoring', 'reb', 'ast', 'stl', 'blk', 'to', 'pf'];
const TRACK_GROUP_KEYS = VIEW_GROUP_KEYS.concat(['opp']);
const groupName = k => (GROUPS.find(g => g[0] === k) || [k, k])[1];
function groupListText(list, all) {
  if (!list || list.length === all.length) return 'all stats';
  if (!list.length) return 'no stats';
  return list.map(groupName).join(', ');
}
// Plain-language lines for the Access list: what they do during games, and what they see after.
function permSummary(p) {
  const perms = p.perms || {};
  if (perms.manage) return ['Assistant coach: edits roster & schedule, tracks any game, sees all stats.'];
  const players = (p.players || []).map(id => S.data.players.find(x => x.id === id)).filter(Boolean).map(x => x.name.split(' ')[0]);
  const lines = ['During games: ' + (perms.trackAny ? 'any game' : 'games you assign') + ' · ' + groupListText(perms.trackGroups, TRACK_GROUP_KEYS) +
    (perms.fixStats ? ' · can fix numbers' : '')];
  if (players.length) lines.push('Own record of: ' + players.join(', '));
  const what = groupListText(perms.viewGroups, VIEW_GROUP_KEYS);
  lines.push('After games: ' + (perms.viewStats ? 'sees whole team (' + what + ')' : perms.viewOwn && players.length ? 'sees ' + players.join(' & ') + ' only (' + what + ')' : 'sees nothing'));
  return lines;
}
function fmtPhone(ph) {
  const m = /^\+?1?(\d{3})(\d{3})(\d{4})$/.exec(ph || '');
  return m ? '(' + m[1] + ') ' + m[2] + '-' + m[3] : ph;
}
function viewParents() {
  const d = S.data;

    (p.email ? ' <span class="muted">' + esc(p.email) + '</span>' : '') + (p.phone ? ' <span class="muted">' + esc(fmtPhone(p.phone)) + '</span>' : '') + '</div></div>' +
    '<div class="row" style="flex-direction:column;gap:6px"><button class="btn sm primary" data-act="invite" data-id="' + esc(p.id) + '">Invite</button><button class="btn sm" data-act="editParent" data-id="' + esc(p.id) + '">Edit</button></div></div>';
  return '<div class="card"><h2>Who can do what</h2>' +

    '<ul class="small access-help"><li><b>During games:</b> which games they keep stats for, and which stats they enter. While a game is going, they see that game\'s live numbers.</li>' +
    '<li><b>After games:</b> by default, <b>nothing</b>. You can let them see just their own player, or the whole team, and pick which stats.</li></ul>' +
    '<p class="small">Tap <b>Edit</b> on a person to change this, or <b>Invite</b> to send them the link and their PIN.</p>' +
    '<p class="small muted">PINs, phone numbers, emails, and these settings are only ever shown to you.</p>' +
    (d.appUrl ? '<div class="copybox"><input readonly value="' + esc(d.appUrl) + '" id="appUrl"><button class="btn sm" data-act="copyUrl">Copy link</button></div>' : '') + '</div>' +
    '<div class="row wrap-row" style="margin-top:14px"><span class="spacer"></span>' +
    (toEmail.length ? '<button class="btn" data-act="emailAll">Email invites (' + toEmail.length + ')</button>' : '') +
    '<button class="btn primary" data-act="editParent">+ Add person</button></div>' +
    '<div class="card">' + (ps.length ? ps.map(item).join('') : '<div class="empty">No one yet. Add the parents who will keep stats.</div>') + '</div>';

function playerForm(p) {

  openModal('<form data-form="player"><h2>' + (p.id ? 'Edit player' : 'Add player') + '</h2>' +

// "11/10", "11/10/2026", "2026-11-10" → "2026-11-10". Month/day without a year uses the season (Jul–Dec = first year).
function parseGameDate(text) {
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(text);
  if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
  m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(text);
  if (!m) return '';
  const month = +m[1], day = +m[2];
  if (month < 1 || month > 12 || day < 1 || day > 31) return '';
  let year;
  if (m[3]) year = m[3].length === 2 ? 2000 + +m[3] : +m[3];
  else {
    const sm = /^(\d{4})/.exec((S.data && S.data.settings.season) || '');
    const now = new Date();
    const start = sm ? +sm[1] : (now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1);
    year = month >= 7 ? start : start + 1;
  }
  return year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}
function parseGameLine(lineText) {
  const parts = lineText.split(',').map(x => x.trim());
  const first = /^(\S+)\s+(.+)$/.exec(parts[0] || '');
  if (!first) return null;
  const date = parseGameDate(first[1]);
  let opponent = first[2].trim(), location = 'home';
  if (/^(@|at)\s+/i.test(opponent)) { location = 'away'; opponent = opponent.replace(/^(@|at)\s+/i, ''); }
  else if (/^vs\.?\s+/i.test(opponent)) opponent = opponent.replace(/^vs\.?\s+/i, '');
  let rest = parts.slice(1);
  if (rest.length && /^(home|away|neutral)$/i.test(rest[0])) { location = rest[0].toLowerCase(); rest = rest.slice(1); }
  return date && opponent ? { date: date, opponent: opponent, location: location, notes: rest.join(', ') } : null;
}

// Fix a player's numbers. Changes go into the chosen quarter (or "No quarter"), so by-quarter totals stay right.
function lineEditor(playerId, scope) {
  const t = S.t;
  const p = findAnyPlayer(playerId);
  if (!p) return;
  if (scope === undefined) scope = (modalState && modalState.editor === playerId) ? modalState.scope : (t.mode ? 0 : t.period || 1);
  const game = line(t.box[playerId]);
  const inScope = scope ? line(((t.periodBoxes || {})[scope] || {})[playerId]) : game;
  const keys = (isOpp(playerId) ? BASE.filter(k => k !== 'GP') : BASE).filter(k => k === 'GP' || canTrackGroup(STAT_GROUP[k]))
    .filter(k => k !== 'REB' || line(t.box[playerId]).rebRaw > 0);
  const warn = [];
  if (game.FG2M > game.FG2A) warn.push('2PT made is more than attempts');
  if (game.FG3M > game.FG3A) warn.push('3PT made is more than attempts');
  if (game.FTM > game.FTA) warn.push('FT made is more than attempts');
  let scopeBar = '';
  if (!t.mode) {
    const maxP = Math.max(4, t.period || 1, ...Object.keys(t.periodBoxes || {}).map(Number));
    const opts = [];
    for (let n = 1; n <= maxP; n++) opts.push([n, periodLabel(n)]);
    opts.push([0, 'None']);
    scopeBar = '<div class="small" style="font-weight:700;margin-top:10px">Fix which quarter?</div><div class="seg box-filter">' +
      opts.map(([n, l]) => '<button class="' + (n === scope ? 'on' : '') + '" data-act="editScope" data-id="' + esc(playerId) + '" data-n="' + n + '">' + l + '</button>').join('') + '</div>';
  }
  // Steppers change the stored counter itself (REB here = the old unsplit rebounds).
  const raw = (src, k) => (k === 'REB' ? src.rebRaw : src[k]);
  const val = k => (k === 'GP' ? game.GP : raw(inScope, k));
  openModal('<h2>' + esc(isOpp(playerId) ? t.game.opponent + ' ' + anyLabel(playerId).replace('Opp ', '') : playerLabel(p)) + '</h2>' +
    '<p class="muted small" style="margin-top:4px">' + game.pts + ' points this game. Changes save right away.</p>' +
    scopeBar +
    (scope ? '<p class="muted small" style="margin:0 0 4px">Numbers below are for <b>' + periodLabel(scope) + '</b>. Game totals are in grey.</p>'
      : (t.mode ? '' : '<p class="muted small" style="margin:0 0 4px">Changes count for the game but not toward any quarter.</p>')) +
    keys.map(k => '<div class="stepper-row"><span class="lbl">' + BASE_LABELS[k] + (scope && k !== 'GP' ? ' <span class="muted small">(game ' + raw(game, k) + ')</span>' : '') + '</span>' +
      '<button data-act="step" data-id="' + esc(playerId) + '" data-k="' + k + '" data-d="-1" ' + (val(k) > 0 ? '' : 'disabled') + ' aria-label="minus">−</button>' +
      '<span class="val">' + val(k) + '</span>' +
      '<button data-act="step" data-id="' + esc(playerId) + '" data-k="' + k + '" data-d="1" ' + (k === 'GP' && game.GP >= 1 ? 'disabled' : '') + ' aria-label="plus">+</button></div>').join('') +
    (warn.length ? '<div class="note">' + warn.map(esc).join('<br>') + '</div>' : '') +
    '<div class="form-actions"><button class="btn primary" data-act="closeModal">Done</button></div>', { editor: playerId, scope: scope });
}

// ===========================================================================
// Game state helpers
// ===========================================================================
function applyEv(box, e) {
  const k = e.playerId || TEAM;
  box[k] = box[k] || {};
  box[k][e.stat] = (box[k][e.stat] || 0) + e.delta;
}
const POINTS = { FG2M: 2, FG3M: 3, FTM: 1 };
// Scoring and team fouls by quarter, kept in step with the box score on this device.
function applyPeriod(periods, e) {
  if (!periods || !e.period) return;
  const q = periods[e.period] || (periods[e.period] = { us: 0, opp: 0, usPF: 0, oppPF: 0 });
  const opp = e.stat === 'OPP' || isOpp(e.playerId);
  if (e.stat === 'OPP') q.opp += e.delta;
  else if (POINTS[e.stat]) q[opp ? 'opp' : 'us'] += POINTS[e.stat] * e.delta;
  else if (e.stat === 'PF') q[opp ? 'oppPF' : 'usPF'] += e.delta;
}
function applyAll(t, e) {
  applyEv(t.box, e);
  if (t.mode || !e.period) return;
  applyPeriod(t.periods, e);
  t.periodBoxes = t.periodBoxes || {};
  applyEv(t.periodBoxes[e.period] || (t.periodBoxes[e.period] = {}), e);
}
// Box score for the chosen filter: whole game, one quarter, or all overtime periods together.
function filteredBox() {
  const t = S.t, f = t.boxFilter || 'all';
  if (f === 'all' || t.mode) return t.box;
  const out = {};
  Object.keys(t.periodBoxes || {}).map(Number).filter(n => (f === 'ot' ? n >= 5 : n === Number(f))).forEach(n => {
    const b = t.periodBoxes[n];
    Object.keys(b).forEach(k => { out[k] = addLine(out[k] || {}, b[k]); if (b[k].OPP) out[k].OPP = n0(out[k].OPP) + b[k].OPP; });
  });
  return out;
}
function boxFilterBar() {
  const t = S.t;
  if (t.mode) return '';
  const ns = Object.keys(t.periodBoxes || {}).map(Number);
  if (!ns.length) return '';
  const opts = [['all', 'Game'], ['1', 'Q1'], ['2', 'Q2'], ['3', 'Q3'], ['4', 'Q4']];
  if (ns.some(n => n >= 5)) opts.push(['ot', 'OT']);
  const f = t.boxFilter || 'all';
  return '<div class="seg box-filter">' + opts.map(([k, l]) => '<button class="' + (f === k ? 'on' : '') + '" data-act="boxFilter" data-f="' + k + '">' + l + '</button>').join('') + '</div>';
}
function periodLabel(n) { return n <= 4 ? 'Q' + n : (n === 5 ? 'OT' : (n - 4) + 'OT'); }
// period: omitted = the quarter being tracked now; a number = that quarter; null = no quarter.
function mkEv(playerId, stat, delta, period) {
  const p = period === undefined ? (S.t.period || 1) : (period || null);
  return { id: uid(), gameId: S.t.game.id, mode: S.t.mode || '', playerId: playerId || '', stat: stat, delta: delta, period: p, time: new Date().toISOString() };
}
const localKey = (gameId, mode) => gameId + (mode === 'personal' ? '_p' : '');
function saveGameLocal() {
  const t = S.t, k = localKey(t.game.id, t.mode);
  store.set('gcs_box_' + k, { game: t.game, players: t.players, box: t.box, periods: t.periods, periodBoxes: t.periodBoxes, canTrack: t.canTrack, canFix: t.canFix, mode: t.mode });
  store.set('gcs_period_' + k, t.period);
  store.set('gcs_plays_' + k, t.plays.slice(0, 400));
}
const isPersonal = () => !!S.t && S.t.mode === 'personal';
function commit(playerId, events, label, quiet) {
  const t = S.t;
  events.forEach(e => applyAll(t, e));
  Queue.push(events);
  const play = { id: uid(), playerId: playerId || '', label: label, events: events, time: new Date().toISOString(), undone: false };
  t.plays.unshift(play);
  saveGameLocal();
  if (!quiet) {
    const p = playerId && findAnyPlayer(playerId);
    const who = !p ? t.game.opponent : isOpp(playerId) ? anyLabel(playerId) : (p.number !== '' ? '#' + p.number : p.name);
    toast(who + ': ' + label, play.id);
  }
  return play;
}
function recordTap(code, playerId) {
  const tap = TAPS[code];
  if (!tap) return;
  commit(playerId, tap.ev.map(([stat, d]) => mkEv(playerId, stat, d)), tap.label);
  S.t.sel = null; S.t.armed = null;
  render();
}

async function openGame(gameId, tab, mode) {
  mode = mode === 'personal' ? 'personal' : '';
  const prevView = S.view;
  S.view = 'loading'; render();
  await Queue.idle();
  Queue.paused = true;
  let t = null;
  try {
    const r = await call('game', { gameId: gameId, mode: mode });
    t = { game: r.game, players: r.players, box: r.box || {}, periods: r.periods || {}, periodBoxes: r.periodBoxes || {}, currentPeriod: r.currentPeriod || 0, canTrack: r.canTrack, canFix: r.canFix, mode: mode, parentBooks: r.parentBooks || [] };
    Queue.items.filter(e => e.gameId === gameId && (e.mode || '') === mode).forEach(e => applyAll(t, e));
  } catch (err) {
    const cached = store.get('gcs_box_' + localKey(gameId, mode), null);
    if (err.network && cached) {
      t = cached; // already includes every play entered on this device
      toast('Offline: showing what is saved on this phone');
    } else {
      Queue.paused = false; Queue.flush();
      S.view = prevView; render();
      if (err.auth) return logout(err.message);
      return toast(err.message);
    }
  }
  Queue.paused = false; Queue.flush();
  const savedPeriod = store.get('gcs_period_' + localKey(gameId, mode), 0);
  S.t = Object.assign(t, {
    tab: t.canTrack ? (tab || 'track') : 'box', side: 'us', sel: null, armed: null,
    period: Math.max(savedPeriod || 0, t.currentPeriod || 0) || 1,
    periods: t.periods || {},
    plays: store.get('gcs_plays_' + localKey(gameId, mode), []), backTo: prevView,
  });
  saveGameLocal();
  S.view = 'game';
  render();
  window.scrollTo(0, 0);
  if (S.t.tab === 'track' && !onCourtPlayers().some(p => n0((S.t.box[p.id] || {}).GP) > 0) && S.t.players.some(p => p.active)) whosHereForm();
}

let refreshing = false;
async function refreshGameFromServer(quiet) {
  // Re-read the official totals (only when nothing is waiting to save).
  const t = S.t;
  if (!t || Queue.count(t.game.id) || refreshing) return;
  refreshing = true;
  try {
    const r = await call('game', { gameId: t.game.id, mode: t.mode });
    t.lastSync = Date.now();
    if (S.t !== t || Queue.count(t.game.id)) return;
    // Only redraw when something changed, so the screen doesn't jump while someone is tapping.
    const before = JSON.stringify([t.box, t.periods, t.game.status, t.flow]);
    if (quiet && before === JSON.stringify([r.box || {}, t.mode ? t.periods : (r.periods || {}), r.game.status, r.flow])) return;
    t.box = r.box || {}; t.game = r.game; t.players = r.players; t.canTrack = r.canTrack; t.canFix = r.canFix; t.parentBooks = r.parentBooks || [];
    if (!t.mode) { t.periods = r.periods || {}; t.periodBoxes = r.periodBoxes || {}; if ((r.currentPeriod || 0) > t.period) t.period = r.currentPeriod; }
    saveGameLocal();
    if (!modalState) render();
  } catch (e) { /* stay with local numbers */ } finally { refreshing = false; }
}
